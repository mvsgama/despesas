<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Despesas</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1f3a"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Despesas"><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f3f5f8;color:#1c2733;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;text-transform:uppercase;padding-bottom:90px}
input,select,textarea,button{font:inherit;color:inherit;text-transform:uppercase}
input[type=url],input[type=password],.nocaps{text-transform:none}
h1,h2,h3{font-weight:800;letter-spacing:.3px;margin:0}
header{background:linear-gradient(100deg,#0f1f3a,#1e3a5f 55%,#2c4a6e);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:19px}
header .who{opacity:.75;font-size:12px;font-weight:600}
#btn-lock{background:rgba(255,255,255,.14);border:0;border-radius:20px;padding:4px 10px;font-size:14px;cursor:pointer}
#sync{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:20px;white-space:nowrap}
#sync.ok{background:#2e9d6b}#sync.err{background:#c0463a}#sync.off{background:#8a6d1c}
nav{background:#16294a;display:flex;overflow-x:auto;padding:0 12px;white-space:nowrap}
nav button{background:none;border:0;color:#b9c6d8;padding:11px 16px;font-weight:700;font-size:12px;cursor:pointer;border-bottom:3px solid transparent;flex:0 0 auto}
nav button.on{color:#fff;border-bottom-color:#4da3d4;background:rgba(255,255,255,.06)}
main{max-width:1500px;margin:0 auto;padding:14px 16px}
.card{background:#fff;border-radius:13px;box-shadow:0 1px 4px rgba(15,31,58,.09);padding:14px 16px;margin-bottom:14px}
.card h3{font-size:13px;color:#16294a;margin-bottom:10px}
.btn{background:#1e5f8a;color:#fff;border:0;border-radius:8px;padding:8px 13px;font-weight:700;font-size:12px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#e4e9f0;color:#16294a}.btn.ok{background:#2e9d6b}.btn.red{background:#c0463a}.btn.sm{padding:4px 9px;font-size:11px}
.btn.big{padding:16px 18px;font-size:13px;min-width:200px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;color:#5a6b80}
input,select,textarea{border:1px solid #cfd7e2;border-radius:7px;padding:6px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #4da3d4;outline-offset:-1px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:13px;padding:12px 14px;box-shadow:0 1px 4px rgba(15,31,58,.09);border-left:4px solid #1e5f8a}
.kpi small{display:block;font-size:10px;font-weight:700;color:#5a6b80}
.kpi b{font-size:18px;font-weight:800;display:block;margin-top:3px}
.kpi i{font-style:normal;font-size:10px;font-weight:700}
.pos{color:#2e9d6b}.neg{color:#c0463a}.mut{color:#7b8898}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin:0}
svg{display:block;max-width:100%}
svg text{font-size:10px;fill:#44536a;text-transform:uppercase}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;font-weight:600;margin-top:8px}
.leg span{cursor:pointer;display:flex;align-items:center;gap:4px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
#tip{position:fixed;z-index:99;background:#0f1f3a;color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:700;pointer-events:none;display:none;white-space:nowrap}
/* avisos */
.aviso{border-radius:10px;padding:9px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:12px}
.aviso.red{background:#fbe6e3;color:#8f2f25;border:1px solid #e9b4ad}
.aviso.org{background:#fdf0dc;color:#8a5a0c;border:1px solid #efcf99}
.aviso.blue{background:#e2eef7;color:#1e4a6b;border:1px solid #b5d0e4}
.aviso span{flex:1 1 220px}
/* tabela lançamentos */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
table.t th{background:#16294a;color:#fff;font-size:10px;padding:6px 4px;text-align:left;position:sticky;top:0}
table.t td{padding:2px 2px;border-bottom:1px solid #edf0f4;vertical-align:middle;overflow:hidden}
table.t td input,table.t td select{width:100%;border:1px solid transparent;background:transparent;padding:4px 3px;font-size:11px;border-radius:4px}
table.t td input:hover,table.t td select:hover{border-color:#cfd7e2;background:#fff}
table.t td input.v{text-align:right;font-weight:700}
table.t tr.pago td{background:#f4faf6}
table.t tr.atr td{background:#fdf1ef}
table.t tr.auto td:first-child{box-shadow:inset 3px 0 0 #8fb8d6}
.x{background:none;border:0;color:#c0463a;font-weight:800;cursor:pointer;font-size:14px;padding:2px 6px}
.st-Pago{color:#2e9d6b;font-weight:700}.st-Atrasado{color:#c0463a;font-weight:700}
.tot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tot .big{background:#16294a;color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-size:15px}
.tot .big small{display:block;font-size:10px;opacity:.75;font-weight:700}
.chip{background:#e4e9f0;border:0;border-radius:18px;padding:6px 12px;font-weight:700;font-size:11px;cursor:pointer}
.chip.on{background:#1e5f8a;color:#fff}
.chip b{margin-left:5px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,31,58,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:14px}
#modal .box{background:#fff;border-radius:14px;padding:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal h3{font-size:15px;margin-bottom:10px;color:#16294a}
#modal .mb{margin-bottom:14px;line-height:1.5}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fg .w2{grid-column:1/3}
.fg.hp{grid-template-columns:repeat(3,1fr)}.fg .wall{grid-column:1/-1}
#fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#2e9d6b;color:#fff;border:0;font-size:32px;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.3);z-index:50}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1f3a;color:#fff;padding:10px 18px;border-radius:22px;font-weight:700;font-size:12px;z-index:95;display:none;max-width:90vw;text-align:center}
.welcome{text-align:center;padding:36px 16px}
.welcome h2{font-size:22px;color:#16294a;margin-bottom:6px}
.welcome .row{justify-content:center;margin-top:20px;gap:12px}
.redbox{background:#fbe6e3;border:1px solid #e9b4ad;border-radius:10px;padding:10px 12px;margin:10px 0}
.redbox h4{margin:0 0 6px;color:#8f2f25;font-size:12px}
.pv{max-height:420px;overflow:auto;border:1px solid #e1e6ed;border-radius:9px}
.tag{display:inline-block;border-radius:10px;padding:1px 7px;font-size:9px;font-weight:800}
.tag.n{background:#dff3e9;color:#1d7a50}.tag.u{background:#e2eef7;color:#1e4a6b}.tag.e{background:#eceff3;color:#66758a}.tag.d{background:#fbe6e3;color:#8f2f25}
.cat{border:1px solid #e1e6ed;border-radius:9px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:200px 1fr auto;gap:8px;align-items:start}
.cat textarea{min-height:34px;resize:vertical;font-size:11px}
.hint{font-size:10px;color:#7b8898;font-weight:600;text-transform:none;line-height:1.45}
.invc{border:1px solid #e1e6ed;border-radius:11px;padding:10px 12px;margin-bottom:10px}
.invc.enc{opacity:.55}
.invc h4{margin:0 0 4px;font-size:13px;color:#16294a}
.sal{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.sal label{flex:0 0 96px;font-size:9px;font-weight:700;color:#5a6b80;display:flex;flex-direction:column;gap:2px}
.sal input{font-size:11px;padding:4px 5px;text-align:right}
.sal input.est{color:#8a97a8;font-style:italic}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){
 main{padding:10px 8px}
 .kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi b{font-size:15px}
 .grid2{grid-template-columns:1fr}
 .fg,.fg.hp{grid-template-columns:1fr 1fr}
 .card{overflow:hidden}.tw table.t:not(.resp){min-width:560px}
 input[type=file]{max-width:100%}
 .cat{grid-template-columns:1fr}
 table.t.resp thead{display:none}
 table.t.resp,table.t.resp tbody{display:block}
 table.t.resp tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 6px;border:1px solid #dfe5ec;border-radius:10px;padding:7px;margin-bottom:8px;background:#fff}
 table.t.resp td{border:0;padding:0;display:flex;flex-direction:column;background:transparent!important}
 table.t.resp tr.pago{background:#f4faf6}table.t.resp tr.atr{background:#fdf1ef}
 table.t.resp td::before{content:attr(data-l);font-size:8px;font-weight:800;color:#8090a4}
 table.t.resp td.wide{grid-column:1/4}
 table.t.resp td input,table.t.resp td select{border-color:#e1e6ed;background:#fff;font-size:12px;padding:5px}
 table.t.resp td.xc{grid-column:3;align-items:flex-end}
 header h1{font-size:16px}
}
#lock,#lockwarn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px}
#lock{z-index:300;background:linear-gradient(140deg,#0f1f3a,#1e3a5f 55%,#2c4a6e)}
#lockwarn{z-index:250;background:rgba(15,31,58,.6)}
#lock .box,#lockwarn .box{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#lockwarn .box{text-align:left;max-width:440px}
#lockwarn h3,#lock h3{color:#16294a;font-size:15px;margin-bottom:8px}
#lock-senha{width:100%;text-align:center;font-size:16px;padding:10px;text-transform:none}
#lock-erro{color:#c0463a;font-weight:800;font-size:11px;min-height:16px;margin-top:6px}
#lock-seg{color:#c0463a;font-size:16px}
body.locked header,body.locked nav,body.locked main,body.locked #fab,body.locked #modal,body.locked #toast,body.locked #tip{display:none!important}
</style></head><body>
<header><h1>◆ CONTROLE DE DESPESAS</h1><span class="who" id="who"></span><span id="sync">☁ NÃO CONECTADO</span><button id="btn-lock" data-a="lock" title="BLOQUEAR AGORA" style="display:none">🔒</button></header>
<nav></nav>
<main><div id="avisos"></div><div id="view"></div></main>
<button id="fab" data-a="fab" title="LANÇAMENTO RÁPIDO">+</button>
<div id="modal"></div><div id="toast"></div><div id="tip"></div>
<div id="lockwarn"><div class="box"><h3>⏳ BLOQUEIO AUTOMÁTICO</h3><div class="mb">O APLICATIVO SERÁ BLOQUEADO EM <b id="lock-seg">60</b> SEGUNDOS POR FALTA DE USO.</div><div class="row end"><button class="btn ok" data-a="lock-cancela">CANCELAR BLOQUEIO AUTOMÁTICO</button></div></div></div>
<div id="lock"><div class="box"><div style="font-size:42px">🔒</div><h3>◆ CONTROLE DE DESPESAS</h3><div class="mut" style="margin:6px 0 12px">APLICATIVO BLOQUEADO. DIGITE O CÓDIGO DE ACESSO.</div><input type="password" id="lock-senha" autocomplete="off" placeholder="código de acesso"><div id="lock-erro"></div><button class="btn ok big" data-a="lock-entrar" style="width:100%;margin-top:10px">DESBLOQUEAR</button></div></div>
<script>
'use strict';
const MODE='web', KEY=MODE==='web'?'controle-despesas-app':'controle-despesas-marcus', WEBURL='https://script.google.com/macros/s/AKfycbwJI6Qt6LcGOpkBn5P7qMr4LYCninxJ-WOyaopD_TLnYGE_2sGImaHL8-_270_3ry15hA/exec';
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const up=s=>String(s??'').toUpperCase().replace(/\s+/g,' ').trim();
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const fmt=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=v=>Math.round((+v||0)*100)/100;
const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const TIPOS={fixa:'DESPESA FIXA',cartao:'CARTÃO DE CRÉDITO',outros:'OUTROS GASTOS',invest:'INVESTIMENTO/RESERVA'};
const TIPOC={fixa:'FIXA',cartao:'CARTÃO',outros:'OUTROS',invest:'INVEST.'};
const PAL=['#16294a','#1e5f8a','#6b7a3a','#c8642a','#4a5563','#5b8bb5','#c9a227','#2e9d6b','#8a4f7d','#3f8f8c','#a6452f','#7d8fa8','#94a34b','#d08a4e'];
const GRAY='#aab3c0';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const mesHoje=()=>hoje().slice(0,7);
function addM(m,n){let[y,mm]=m.split('-').map(Number);const t=y*12+mm-1+n;return Math.floor(t/12)+'-'+pad(t%12+1)}
const diffM=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(yb-ya)*12+mb-ma};
const mlabel=m=>m?MES[+m.slice(5,7)-1]+'/'+m.slice(2,4):'';
const dlabel=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4):'';
function shiftDate(d,n){if(!d)return '';const m=addM(d.slice(0,7),n);const last=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();return m+'-'+pad(Math.min(+d.slice(8,10),last))}
function addD(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)}
function parseNum(s){
  if(typeof s==='number')return s;
  if(s==null)return NaN;
  let t=String(s).replace(/R\$|\s| /g,'');if(!t)return NaN;
  let neg=/^\(.*\)$/.test(t)||/^[-−]/.test(t)||/[-−]$/.test(t);
  t=t.replace(/[()−-]/g,'');
  if(!/^[\d.,]+$/.test(t))return NaN;
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');
  else if((t.match(/\./g)||[]).length>1||/\.\d{3}$/.test(t)&&t.length>4&&!/^\d+\.\d{3}$/.test(t))t=t.replace(/\./g,'');
  const v=parseFloat(t);return isNaN(v)?NaN:(neg?-v:v);
}
/* ---------- estado ---------- */
const CATS0=[
 ['Moradia','aluguel,condominio,iptu,prestacao,financiamento,apto,aptº,imovel,reforma,construcard'],
 ['Contas e serviços','luz,energia,agua,gas,internet,celular,telefone,sky,tarifa,mei,das,vivo,claro,tim,oi,taxa,jazigo,seguro'],
 ['Alimentação fora','ifood,restaurante,lanchonete,lanche,pizza,burger,padaria,bar,cafe,comida,churrasc'],
 ['Mercado','mercado,supermercado,carrefour,atacadao,assai,hortifruti,guanabara,mundial,big box'],
 ['Transporte','uber,99,combustivel,posto,gasolina,seguro carro,ipva,estacionamento,pedagio,carro,pneu,onibus,metro,gnv,vistoria,apvs'],
 ['Saúde','farmacia,drogaria,remedio,plano de saude,amil,unimed,dentista,hospital,exame,medico'],
 ['Compras','amazon,magazine,mercado livre,shopee,aliexpress,riachuelo,renner,cea,loja,shopping,cartao,roupa,tenis'],
 ['Cuidados pessoais','salao,barbearia,cabeleireiro,estetica,perfume,boticario,academia'],
 ['Pets','pet,veterinario,racao'],
 ['Educação','escola,curso,faculdade,fies,livro,ingles,material escolar,mensalidade'],
 ['Lazer','cinema,viagem,hotel,parque,disney,netflix,spotify,show,ingresso,beto carrero,google,clubinho'],
 ['Reserva/investimento','reserva,investimento,cdb,lci,lca,tesouro,poupanca,aplicacao'],
 ['Outros','']];
function novoEstado(){return{v:1,saved:0,desp:[],rec:[],inv:[],excl:[],hor:'',
  cfg:{nome:'',reserva:3000,mesesFrente:3,diasAviso:5,cdi:13.65,ipca:4.6,fgc:250000,
       cats:CATS0.map(([n,k])=>({n:up(n),k:k?k.split(','):[]}))}}}
let S=novoEstado();
let SY={url:'',token:''};
function carregar(){
  try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.desp)S=Object.assign(novoEstado(),o,{cfg:Object.assign(novoEstado().cfg,o.cfg||{})})}}catch(e){}
  try{const t=localStorage.getItem(KEY+'-sync');if(t)SY=Object.assign(SY,JSON.parse(t))}catch(e){}
  if(MODE==='web')SY.url=WEBURL;
  normalizar();
}
function gravarLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('NÃO FOI POSSÍVEL SALVAR NO NAVEGADOR');return false}}
function save(){aplicar10();S.saved=Date.now();gravarLocal();Sync.agendar()}
const brutoDe=r=>r.bruto!=null&&r.bruto!==''?+r.bruto:+r.valor||0;
function normalizar(){ // preenche o bruto de holerites lançados antes desta versão
  for(const t of['A','F'])for(const r of S.rec){if(!r.hol||r.hol[0]!==t||r.bruto!=null||!r.conf||!r.conf.R)continue;
    const g=re=>(r.conf.R.find(x=>re.test(x.item))||{}).hol;
    if(t==='A'){const b=g(/^ADIANTAMENTO BRUTO/);if(b!=null)r.bruto=r2(b)}
    else{const tv=g(/^SOMA DOS VENCIMENTOS/),a=S.rec.find(x=>x.hol==='A|'+r.hol.slice(2)),ad=a&&a.bruto!=null?a.bruto:g(/^ADIANTAMENTO JÁ RECEBIDO/)!=null?g(/^ADIANTAMENTO JÁ RECEBIDO/)/(1-((S.cfg.hol&&S.cfg.hol.aliq)||27.5)/100):0;if(tv!=null)r.bruto=r2(tv-ad)}}
}
/* ---------- base dos 10% e despesa vinculada ---------- */
function base10(m){ // salário entra pela competência da folha: bruto da folha + bruto do adiantamento dela
  const R=S.rec.filter(r=>r.mes===m),ehA=r=>r.hol&&r.hol[0]==='A',bm=R.filter(r=>!ehA(r)).reduce((s,r)=>s+brutoDe(r),0);let ad=0,comps=[];
  for(const r of R){if(!r.hol||r.hol[0]!=='F')continue;const a=S.rec.find(x=>x.hol==='A|'+r.hol.slice(2));if(a){ad+=brutoDe(a);comps.push(r.hol.slice(2))}}
  const fora=R.filter(r=>ehA(r)&&!comps.includes(r.hol.slice(2))).map(r=>({comp:r.hol.slice(2),v:brutoDe(r)}));
  return{bm:r2(bm),ad:r2(ad),comps,fora,base:r2(bm+ad),dez:r2((bm+ad)*.1),folha:R.some(r=>r.hol&&r.hol[0]==='F')}}
function auto10(){const f=()=>JSON.stringify(S.desp.filter(d=>d.p10).map(d=>[d.id,d.valor,!!d.est10]))+(S.cfg.p10Ini||''),a=f();aplicar10();if(f()!==a)save()}
function aplicar10(){
  if(!S.desp.some(d=>d.p10)){const k=S.desp.find(d=>d.tipo==='fixa'&&/^D-{3,}$/.test(d.desc));if(k){const fk=fkey(k);S.desp.forEach(d=>{if(d.tipo==='fixa'&&fkey(d)===fk)d.p10=true});if(!S.cfg.p10Ini)S.cfg.p10Ini=mesHoje()}}
  const ini=S.cfg.p10Ini;if(!ini)return;
  const L=S.desp.filter(d=>d.p10).sort((a,b)=>a.mes.localeCompare(b.mes));let ant=null;
  for(const d of L){if(d.mes>=ini&&d.status!=='Pago'&&!d.man10){const b=base10(d.mes);if(b.folha){d.valor=b.dez;d.est10=false}else if(ant!=null){d.valor=ant;d.est10=true}}ant=d.valor}
}

  for(const d of [...S.desp]){const p=parc(d.desc);if(!p||p.n>=p.m)continue;const k=pkey(d,p);
    for(let i=p.n+1;i<=p.m;i++){const mes=addM(d.mes,i-p.n);

  for(const[k,occ]of GR){let alive=occ.has(prev)||skip(k,prev),tpl=null;for(const[m,d]of occ)if(m<cur&&(!tpl||m>tpl.mes))tpl=d;
    for(let T=cur;T<=maxOpen;T=addM(T,1)){if(occ.has(T)){alive=true;tpl=occ.get(T);continue}if(!alive||!tpl)continue;if(stop(k,T)){alive=false;continue}if(skip(k,T))continue;
      S.rec.push(Object.assign({},tpl,{id:uid(),mes:T,data:shiftDate(tpl.data,diffM(tpl.mes,T)),auto:true}))}}

}

function filtrados(){
  const f=U.f,q=norm(f.q);

    if(f.ids)return f.ids.includes(d.id);
    if(f.mes&&d.mes!==f.mes)return false;if(f.pes&&d.pessoa!==f.pes)return false;if(f.tipo&&d.tipo!==f.tipo)return false;if(f.cat&&d.cat!==f.cat)return false;
    if(f.banco==='-'){if(d.banco)return false}else if(f.banco&&d.banco!==f.banco)return false;
    if(f.st==='pend'&&d.status==='Pago')return false;if(f.st==='pago'&&d.status!=='Pago')return false;
    if(q&&!norm(d.desc+' '+d.obs+' '+d.banco+' '+d.cat).includes(q))return false;return true;

      if(ds.f==='valor'){const v=parseNum(t.value);if(!isNaN(v)){r.valor=r2(Math.abs(v));if(r.fixa)seg.forEach(x=>x.valor=r.valor)}}
      else if(ds.f==='bruto'){const v=parseNum(t.value);if(t.value.trim()===''||isNaN(v))delete r.bruto;else r.bruto=r2(Math.abs(v));if(r.fixa)seg.forEach(x=>{if(r.bruto==null)delete x.bruto;else x.bruto=r.bruto})}
      else if(ds.f==='fixa'){r.fixa=t.checked;if(!r.fixa)S.rec=S.rec.filter(x=>!seg.includes(x));else S.excl=S.excl.filter(e=>e.k!==rkey(r))}
      else if(ds.f==='desc'){const n=up(t.value);if(n){if(r.fixa)seg.forEach(x=>x.desc=n);r.desc=n}}
      else r[ds.f]=ds.f==='data'?t.value:up(t.value);
      r.auto=false;gerar();save();setTimeout(render,0)}return}
  if(ds.pi!=null){U.imp.st.itens[+ds.pi].on=t.checked;render();return}
  if(ds.pt!=null){U.imp.st.itens[+ds.pt].tipo=t.value;return}
  if(ds.pc!=null){U.imp.st.itens[+ds.pc].cat=t.value;return}
  if(ds.fi!=null){U.imp.st.itens[+ds.fi].on=t.checked;render();return}
  if(ds.fa!=null){U.imp.st.apagar[+ds.fa].on=t.checked;render();return}
  if(ds.c){const c=S.cfg;if(ds.c==='nome'){const o=c.nome;c.nome=up(t.value);if(o&&c.nome){S.desp.forEach(x=>{if(x.pessoa===o)x.pessoa=c.nome});S.rec.forEach(x=>{if(x.pessoa===o)x.pessoa=c.nome})}}
    else if(ds.c==='mesesFrente'||ds.c==='diasAviso')c[ds.c]=Math.max(0,parseInt(t.value)||0);
    else{const v=parseNum(t.value);if(isNaN(v)||v<0){toast('VALOR INVÁLIDO');render();return}c[ds.c]=v;if(ds.c==='reserva')S.desp.forEach(x=>{if(x.auto&&fkey(x)===RKEY)x.valor=v})}
    if(ds.c==='reserva'&&!(c.reserva>0))S.desp=S.desp.filter(x=>!(x.auto&&fkey(x)===RKEY&&x.status!=='Pago'));
    gerar();save();render();return}
  if(ds.banco!=null){const o=ds.banco,n=up(t.value);if(n&&n!==o){S.desp.forEach(x=>{if(x.banco===o)x.banco=n});S.excl.forEach(e=>{e.k=e.k.split('|').map(p=>p===norm(o)?norm(n):p).join('|')});save();render();toast('BANCO RENOMEADO EM TODOS OS MESES')}return}
  if(ds.catn!=null){const c=S.cfg.cats[+ds.catn],n=up(t.value);if(c&&n&&n!==c.n&&!S.cfg.cats.some(x=>x.n===n)){S.desp.forEach(x=>{if(x.cat===c.n)x.cat=n});c.n=n;save()}render();return}
  if(ds.catk!=null){S.cfg.cats[+ds.catk].k=t.value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);save();return}
  if(ds.sal){const a=S.inv.find(x=>x.id===ds.sal);if(a){a.saldos=a.saldos||{};const v=parseNum(t.value);if(t.value.trim()===''||isNaN(v))delete a.saldos[ds.m];else a.saldos[ds.m]=r2(v);save();render()}return}
});

document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='lock-senha'){Trava.tentar();return}if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&(ev.target.dataset.id||ev.target.dataset.rid))ev.target.blur();if(ev.key==='Escape'){const M=$('#modal');if(M.style.display==='flex'){const c=M.querySelector('[data-mv="0"],[data-a="conf-fechar"]');if(c)c.click()}}});
const tip=()=>$('#tip');
document.addEventListener('mousemove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]'),el=tip();if(!t){el.style.display='none';return}el.textContent=t.dataset.tip;el.style.display='block';el.style.left=Math.min(window.innerWidth-el.offsetWidth-8,ev.clientX+12)+'px';el.style.top=(ev.clientY-34)+'px'});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)Sync.buscar()});

/* ---------- bloqueio do aplicativo ---------- */
const Trava={on:false,ult:Date.now(),aviso:false,
  ativo(){return !!SY.token},
  min(){const m=+S.cfg.lockMin;return isNaN(m)||S.cfg.lockMin==null?5:m},
  bloquear(){if(!this.ativo()){toast('CONECTE A SINCRONIZAÇÃO PARA USAR O BLOQUEIO');return}this.on=true;this.aviso=false;$('#lockwarn').style.display='none';document.body.classList.add('locked');$('#lock-erro').textContent='';const i=$('#lock-senha');i.value='';$('#lock').style.display='flex';setTimeout(()=>{try{i.focus()}catch(e){}},50)},
  liberar(){this.on=false;this.ult=Date.now();document.body.classList.remove('locked');$('#lock').style.display='none';$('#lock-senha').value='';render()},
  async tentar(){const v=$('#lock-senha').value.trim();if(!v)return;if(v===SY.token){this.liberar();return}
    // o código pode ter sido trocado no Apps Script: confere com o servidor antes de recusar
    if(navigator.onLine&&(MODE==='gas'||SY.url)){const ant=SY.token;try{$('#lock-erro').textContent='CONFERINDO…';SY.token=v;await Sync.chamar('get');try{localStorage.setItem(KEY+'-sync',JSON.stringify(SY))}catch(e){}this.liberar();Sync.buscar();return}catch(e){SY.token=ant}}
    $('#lock-erro').textContent='CÓDIGO INCORRETO';$('#lock-senha').value='';$('#lock-senha').focus()},
  mexeu(){if(this.on||this.aviso)return;this.ult=Date.now()},
  cancelarAviso(){this.aviso=false;this.ult=Date.now();$('#lockwarn').style.display='none'},
  tick(){if(this.on||!this.ativo())return;const lim=this.min()*60000;if(!(lim>0))return;const par=Date.now()-this.ult;
    if(par>=lim+60000){this.bloquear();return}
    if(par>=lim){this.aviso=true;$('#lockwarn').style.display='flex';$('#lock-seg').textContent=Math.max(0,Math.ceil((lim+60000-par)/1000))}},
  iniciar(){for(const e of['pointerdown','keydown','wheel','touchstart','scroll','input'])document.addEventListener(e,()=>this.mexeu(),{passive:true,capture:true});setInterval(()=>this.tick(),1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.tick()})}
};

if(MODE==='web'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>setTimeout(preCarregar,3000)).catch(()=>{});
function iniciar(){carregar();if(gerar())gravarLocal();Sync.mostra('');if(Trava.ativo())Trava.bloquear();render();Trava.iniciar();if(MODE!=='local'&&!SY.token)pedirCodigo();else if(Sync.ativo())Sync.buscar();else{Sync.buscar();auto10()}}
iniciar();
